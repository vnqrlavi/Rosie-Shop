<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rosie Shop | Register</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Poppins, sans-serif;
}

body {
    min-height: 100vh;
    background: #fff0f6;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #555;
}

.container {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 25px;
    padding: 30px 25px;
    box-shadow: 0 10px 30px rgba(255, 143, 177, 0.18);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    color: #ff78a7;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #666;
}

input {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #f2c7d8;
    border-radius: 12px;
    outline: none;
    margin-bottom: 15px;
    font-size: 14px;
    background: #fffafd;
}

input:focus {
    border-color: #ff8fb1;
}

button {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff8fb1, #ffb6d9);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 5px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
    min-height: 20px;
}

.login {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #888;
}

.login a {
    color: #ff78a7;
    font-weight: 600;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">rosie shop 🎀</div>

    <div class="subtitle">
        Create your buyer account
    </div>

    <form id="registerForm">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            required
        >

        <button type="submit" id="registerBtn">
            Register
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Log in</a>
    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    set
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


/* =========================================
   FIREBASE CONFIG
   Replace these with YOUR Firebase config
========================================= */

const firebaseConfig = {
    apiKey: "AIzaSyC1DTja7wun0ziVdfgNiVupf1kCpDNl8hM",
    authDomain: "rosie-shop.firebaseapp.com",
    databaseURL: "https://rosie-shop-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "rosie-shop",
    storageBucket: "rosie-shop.firebasestorage.app",
    messagingSenderId: "16582833070",
    appId: "1:16582833070:web:70db6fdcd4a111554e8e3f",
    measurementId: "G-46NPDYJNES"
};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);


/* =========================================
   REGISTER
========================================= */

const registerForm = document.getElementById("registerForm");
const registerBtn = document.getElementById("registerBtn");
const message = document.getElementById("message");


registerForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    /* Check passwords */

    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        message.style.color = "#d9534f";

        return;
    }


    /* Disable button */

    registerBtn.disabled = true;

    registerBtn.textContent = "Creating account...";


    try {

        /* Create Firebase Authentication account */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = userCredential.user;


        /*
           Create buyer profile in Realtime Database
        */

        await set(
    ref(database, "users/" + user.uid),
    {
        name: name,
        email: user.email,
        role: "buyer",
        berry: 0,
        createdAt: Date.now()
    }
);


        message.textContent =
            "Account created successfully!";

        message.style.color = "#4caf50";


        /*
           Redirect to buyer account page
        */

        setTimeout(() => {

            window.location.href = "index.html";

        }, 1000);


    } catch (error) {

        console.error(error);


        let errorMessage =
            "Registration failed.";

        if (error.code === "auth/email-already-in-use") {

            errorMessage =
                "This email is already registered.";

        } else if (error.code === "auth/invalid-email") {

            errorMessage =
                "Please enter a valid email.";

        } else if (error.code === "auth/weak-password") {

            errorMessage =
                "Password must be at least 6 characters.";

        }


        message.textContent = errorMessage;

        message.style.color = "#d9534f";


        registerBtn.disabled = false;

        registerBtn.textContent = "Register";

    }

});

</script>

</body>
</html>
